name: Nightly release build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            executable: chitin-desktop
          - os: windows-latest
            target: windows-x86_64
            executable: chitin-desktop.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build desktop release
        run: cargo build -p chitin-desktop --release --locked

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/chitin-desktop dist/chitin-desktop

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/chitin-desktop.exe dist/chitin-desktop.exe

      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: chitin-${{ matrix.target }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  release:
    name: Publish nightly prerelease
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release executables
        uses: actions/download-artifact@v4
        with:
          pattern: chitin-*
          merge-multiple: true
          path: release

      - name: Update nightly tag
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push origin --force refs/tags/nightly

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build for commit ${{ github.sha }}.
          files: |
            release/chitin-desktop
            release/chitin-desktop.exe
          fail_on_unmatched_files: true
