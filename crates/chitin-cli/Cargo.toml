[package]
name = "chitin"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
description = "command-line tools for Chitin: a modern, agent-native computational chemistry and bioinformatics integrated development suite"
documentation = "https://docs.rs/chitin"
readme = "README.md"
keywords = [
  "structural-biology",
  "pdb",
  "rcsb",
  "cli",
  "computation-chemistry",
  "chemistry",
  "biology",
]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "chitin"
path = "src/main.rs"

[dependencies]
chitin-command = { version = "0.1.0", path = "../chitin-command" }
chitin-databases = { version = "0.1.0", path = "../chitin-databases" }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
indicatif = "0.18"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
