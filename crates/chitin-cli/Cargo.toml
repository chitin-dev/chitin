[package]
name = "chitin-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chitin"
path = "src/main.rs"

[dependencies]
chitin-command = { path = "../chitin-command" }
chitin-databases = { path = "../chitin-databases" }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
indicatif = "0.18"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
