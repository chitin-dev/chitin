[package]
name = "chitin-databases"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
async-trait = "0.1.89"
bytes = "1.11"
futures-util = "0.3"
http = "1.4"
log = "0.4.33"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
  "rustls-tls-native-roots",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "sync", "time"] }
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tempfile = "3.23"

[[test]]
name = "rcsb"
path = "tests/rcsb.rs"
required-features = ["test-support"]

[lints]
workspace = true
