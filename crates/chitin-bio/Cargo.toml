[package]
name = "chitin-bio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chitin-bio-macros = { path = "../chitin-bio-macros" }
thiserror = "2.0"

[dev-dependencies]
chitin-databases = { path = "../chitin-databases" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.23"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
