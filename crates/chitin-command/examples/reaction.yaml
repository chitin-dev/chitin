# Positions and annotation dimensions use y-down SVG drawing units.
# Authored atom positions, when supplied, use normalized y-up bond units.
version: 1
molecules:
  - id: hydroxide
    smiles: '[OH-]'
    at: [0, 0]
  - id: substrate
    smiles: 'CC(C)I'
    at: [160, 60]
    positions: [[-0.866, 0.5], [0, 0], [0.866, 0.5], [0, -1]]
  - id: product
    smiles: 'CC(C)O.[I-]'
    at: [430, 60]
annotations:
  - type: highlight
    molecule: substrate
    atoms: [1, 3]
    bonds: [[1, 3]]
    radius: 7
    color: [130, 200, 170, 100]
  - type: lone-pair
    anchor: {molecule: hydroxide, target: {type: atom, index: 0}, offset: [16, 14]}
    angle: 0
    color: [240, 30, 30, 255]
  - type: electron-arrow
    from: {molecule: hydroxide, target: {type: atom, index: 0}, offset: [16, 14]}
    to: {molecule: substrate, target: {type: atom, index: 1}}
    bend: 45
  - type: electron-arrow
    from: {molecule: substrate, target: {type: bond, atoms: [1, 3]}}
    to: {molecule: substrate, target: {type: atom, index: 3}}
    bend: -42
  - type: reaction-arrow
    start: [250, 60]
    end: [350, 60]
