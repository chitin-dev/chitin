[package]
name = "chitin-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable GPUI components for chitin desktop application"

[features]
default = ["x11", "wayland"]
x11 = ["gpui/x11", "gpui-kit/x11"]
wayland = ["gpui/wayland", "gpui-kit/wayland"]

[dependencies]
chitin-terminal = { path = "../chitin-terminal" }
gpui.workspace = true
gpui-kit.workspace = true
log = "0.4.33"
rust-embed = { version = "8.12.0", features = ["debug-embed", "include-exclude", "interpolate-folder-path"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
criterion = "0.5"
env_logger = "0.10"

[[bench]]
name = "tree_virtualization"
harness = false

[lints]
workspace = true
