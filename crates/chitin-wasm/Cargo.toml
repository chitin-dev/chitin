[package]
name = "chitin-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/chitin-dev/chitin"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
chitin-bio = { path = "../chitin-bio" }
chitin-wgpu = { path = "../chitin-wgpu" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
