[workspace]
members = [
  "crates/chitin-builtin-shell",
  "crates/chitin-command",
  "crates/chitin-cli",
  "crates/chitin-bio",
  "crates/chitin-bio-macros",
  "crates/chitin-utils",
  "crates/chitin-databases",
  "crates/chitin-desktop",
  "crates/chitin-molecule-renderer",
  "crates/chitin-terminal",
  "crates/chitin-ui",
  "crates/chitin-wgpu",
  "crates/chitin-wasm",
  "tools/chitin-mmcif-schema",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chitin-dev/chitin"

[workspace.dependencies]
# Kit and the direct GPUI imports must use the same WGPU backend revision.
gpui = { package = "gpui-ce", git = "https://github.com/chitin-dev/gpui-wgpu", rev = "ce07f09bf2f60710e6d1d5426cb4ee0d8177936a" }
gpui-kit = { git = "https://github.com/chitin-dev/gpui-kit", rev = "7f7f61f02c9cbfbbce666caf83152b5064a185ad" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
