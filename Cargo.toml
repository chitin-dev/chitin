[workspace]
members = [
  "crates/chitin-builtin-shell",
  "crates/chitin-command",
  "crates/chitin-cli",
  "crates/chitin-bio",
  "crates/chitin-bio-macros",
  "crates/chitin-utils",
  "crates/chitin-databases",
  "crates/chitin-desktop",
  "crates/chitin-molecule-renderer",
  "crates/chitin-terminal",
  "crates/chitin-ui",
  "crates/chitin-wgpu",
  "crates/chitin-wasm",
  "tools/chitin-mmcif-schema",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chitin-dev/chitin"

[workspace.dependencies]
# Kit and the direct GPUI imports must use the same WGPU backend revision.
gpui = { package = "gpui-ce", git = "https://github.com/chitin-dev/gpui-wgpu", rev = "3679d575d3f912efb3b956684898bdab64efc65c" }
gpui-kit = { git = "https://github.com/chitin-dev/gpui-kit", rev = "f082c939e472eb74fd506c9fe7031c41331561c2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
