[workspace]
members = [
  "benchmarks/chitin-chemdraw",
  "crates/chitin-builtin-shell",
  "crates/chitin-command",
  "crates/chitin-cli",
  "crates/chitin-bio",
  "crates/chitin-bio-macros",
  "crates/chitin-chem",
  "crates/chitin-chemdraw",
  "crates/chitin-utils",
  "crates/chitin-databases",
  "crates/chitin-desktop",
  "crates/chitin-molecule-renderer",
  "crates/chitin-terminal",
  "crates/chitin-ui",
  "crates/chitin-wgpu",
  "crates/chitin-wasm",
  "tools/chitin-mmcif-schema",
  "tools/chitin-release-audit",
  "tools/chitin-chemdraw-batch",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chitin-dev/chitin"

[workspace.dependencies]
# Kit and the direct GPUI imports must use the same WGPU backend revision.
gpui = { package = "gpui-ce", git = "https://github.com/chitin-dev/gpui-wgpu", rev = "d729d4640a0213d0a51de9b7d7ff014f93c472c7", default-features = false, features = ["font-kit"] }
gpui-kit = { git = "https://github.com/chitin-dev/gpui-kit", rev = "8f13165c0445a5957eca31aa00e8a85ee24a365a", default-features = false, features = ["component", "assets"] }

[profile.release]
strip = "symbols"

# Keep vectorization and panic isolation; optimize linking before trading runtime
# performance for smaller code. Compare this profile against stripped release.
[profile.release-size]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
