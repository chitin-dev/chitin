[workspace]
members = [
  "crates/chitin-builtin-shell",
  "crates/chitin-command",
  "crates/chitin-cli",
  "crates/chitin-bio",
  "crates/chitin-bio-macros",
  "crates/chitin-chem",
  "crates/chitin-chemdraw",
  "crates/chitin-utils",
  "crates/chitin-databases",
  "crates/chitin-desktop",
  "crates/chitin-molecule-renderer",
  "crates/chitin-terminal",
  "crates/chitin-ui",
  "crates/chitin-wgpu",
  "crates/chitin-wasm",
  "tools/chitin-mmcif-schema",
  "tools/chitin-chemdraw-batch",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chitin-dev/chitin"

[workspace.dependencies]
# Kit and the direct GPUI imports must use the same WGPU backend revision.
gpui = { package = "gpui-ce", git = "https://github.com/chitin-dev/gpui-wgpu", rev = "d92ff407d66a52795f70fb6657a4bfa653c3d0d5" }
gpui-kit = { git = "https://github.com/chitin-dev/gpui-kit", rev = "be0403f152159195b57e9a6a0ccf59694a0542e9" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
